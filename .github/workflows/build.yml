name: Build app and bridge

on:
  push:
    branches: [master]
    tags: ['v*']
  schedule:
    # Every day at 02:00 Asia/Taipei.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select update channel and version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.build.outputs.channel }}
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: build
        shell: bash
        run: |
          set -euo pipefail
          channel=nightly
          tag=nightly
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=release
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'channel=%s\nversion=%s\ntag=%s\n' "$channel" "$version" "$tag" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android releases
    runs-on: ubuntu-latest
    needs: prepare
    env:
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - name: Configure Gradle limits
        run: |
          printf '\n%s\n' \
            'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m' \
            'org.gradle.workers.max=2' \
            'kotlin.daemon.jvmargs=-Xmx1G' >> android/gradle.properties
      - run: flutter pub get
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/codeaw-release.jks
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::Missing KEYSTORE_BASE64 secret.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
      - name: Build signed APKs and app bundle
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/codeaw-release.jks
        run: |
          set -euo pipefail
          for secret in KEYSTORE_ALIAS KEYSTORE_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing $secret secret."
              exit 1
            fi
          done
          mkdir -p ../dist
          flutter build apk --release --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="CODEAW_UPDATE_CHANNEL=$UPDATE_CHANNEL" --dart-define="CODEAW_UPDATE_REPOSITORY=$GITHUB_REPOSITORY"
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/codeaw-universal.apk
          flutter build apk --release --split-per-abi --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="CODEAW_UPDATE_CHANNEL=$UPDATE_CHANNEL" --dart-define="CODEAW_UPDATE_REPOSITORY=$GITHUB_REPOSITORY"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "../dist/codeaw-${abi}.apk"
          done
          flutter build appbundle --release --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="CODEAW_UPDATE_CHANNEL=$UPDATE_CHANNEL" --dart-define="CODEAW_UPDATE_REPOSITORY=$GITHUB_REPOSITORY"
          cp build/app/outputs/bundle/release/app-release.aab ../dist/codeaw.aab
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/codeaw-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-android
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios:
    name: Unsigned iOS IPA
    runs-on: macos-latest
    needs: prepare
    env:
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="CODEAW_UPDATE_CHANNEL=$UPDATE_CHANNEL" --dart-define="CODEAW_UPDATE_REPOSITORY=$GITHUB_REPOSITORY"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p ../dist "$RUNNER_TEMP/unsigned-ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/unsigned-ipa/Payload/Runner.app"
          (cd "$RUNNER_TEMP/unsigned-ipa" && zip -qry "$GITHUB_WORKSPACE/dist/codeaw-ios-unsigned.ipa" Payload)
          unzip -t ../dist/codeaw-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-ios
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    name: Web app (mobile and desktop)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test app updater
        run: flutter test test/app_updater_test.dart
      - name: Build web app with local renderer assets
        run: flutter build web --release --no-web-resources-cdn --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="CODEAW_UPDATE_CHANNEL=$UPDATE_CHANNEL" --dart-define="CODEAW_UPDATE_REPOSITORY=$GITHUB_REPOSITORY"
      - name: Archive web app
        run: |
          mkdir -p ../dist
          tar -czf ../dist/codeaw-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: codeaw-web-assets
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-web
          path: dist/codeaw-web.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bridge:
    name: Bridge (${{ matrix.platform }})
    needs: [prepare, web]
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
          - platform: linux-arm64
            target: bun-linux-arm64
          - platform: linux-x64-musl
            target: bun-linux-x64-musl
          - platform: linux-arm64-musl
            target: bun-linux-arm64-musl
          - platform: windows-x64
            runner: windows-latest
            target: bun-windows-x64
            arch: x64
          - platform: windows-arm64
            runner: windows-latest
            target: bun-windows-arm64
            arch: arm64
          - platform: macos-x64
            target: bun-darwin-x64
          - platform: macos-arm64
            target: bun-darwin-arm64
    defaults:
      run:
        working-directory: bridge
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: codeaw-web-assets
          path: bridge/dist/web
      - name: Embed bridge update metadata
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_TARGET: ${{ matrix.platform }}
        run: node scripts/set-build-metadata.mjs "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$UPDATE_CHANNEL" "$GITHUB_REPOSITORY" "$BUILD_TARGET"
      - name: Build every package bin
        run: npm run build:bin -- --target=${{ matrix.target }}
      - name: Install NSIS
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        if: startsWith(matrix.platform, 'windows-')
        env:
          CODEAW_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm run build:installer -- --skip-build --arch=${{ matrix.arch }}
      - name: Smoke test native executable
        if: matrix.platform == 'linux-x64'
        run: node scripts/background-smoke.mjs dist/bin/codeaw-bridge
      - name: Package Windows executables
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Copy-Item -LiteralPath ../LICENSE -Destination dist/bin/LICENSE
          Compress-Archive -Path dist/bin/* -DestinationPath "../dist/codeaw-bridge-$env:PLATFORM.zip"
          Copy-Item -Path dist/installer/*-setup.exe -Destination ../dist/
      - name: Package Unix executables
        if: ${{ !startsWith(matrix.platform, 'windows-') }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp ../LICENSE dist/bin/LICENSE
          tar -czf "../dist/codeaw-bridge-${PLATFORM}.tar.gz" -C dist/bin .
      - name: Test Linux one-command installer
        if: matrix.platform == 'linux-x64'
        env:
          CODEAW_TEST_PACKAGE: ../dist/codeaw-bridge-linux-x64.tar.gz
        run: python3 ../scripts/test-linux-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-bridge-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bridge-installer-test:
    name: Windows installer smoke
    needs: bridge
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: nightly-bridge-windows-x64
          path: bridge/dist/download
      - name: Extract packaged bridge
        run: Expand-Archive -LiteralPath dist/download/codeaw-bridge-windows-x64.zip -DestinationPath dist/bin
      - name: Test install, update and uninstall
        run: node scripts/installer-smoke.mjs dist/download/codeaw-bridge-windows-x64-setup.exe
      - name: Test tray survives CLI exit
        run: node scripts/tray-smoke.mjs dist/bin/codeaw-bridge.exe
      - run: npm ci
      - name: Render packaged desktop windows including updater
        run: npm run smoke:desktop -- dist/desktop-smoke/packaged-tray.ps1

  release:
    name: Publish app and bridge release
    needs: [prepare, android, ios, web, bridge, bridge-installer-test]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Generate updater manifests
        run: |
          node --test scripts/create-update-manifest.test.mjs
          node scripts/create-update-manifest.mjs dist "$GH_REPO" "$UPDATE_CHANNEL" "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$RELEASE_TAG" "$GITHUB_SHA"
          node scripts/create-bridge-update-manifest.mjs dist "$GH_REPO" "$UPDATE_CHANNEL" "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          cp install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          $UPDATE_CHANNEL build $APP_VERSION+$GITHUB_RUN_NUMBER from commit [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          The nightly release is updated in place after each successful nightly build. Version tags publish stable releases.

          - Android: signed universal APK, per-ABI APKs, and AAB.
          - App updater: app-update.json contains the channel, version, download URLs, sizes, and SHA-256 checksums.
          - Bridge updater: bridge-update.json contains verified installer and portable downloads for every platform.
          - iOS: unsigned IPA (sign before installing on an iPhone or iPad).
          - Web: mobile and desktop browser app, included with every bridge release and also available as codeaw-web.tar.gz.
          - Bridge: standalone Windows, Linux (glibc/musl), and macOS executables for x64 and ARM64.
          - Windows: per-user NSIS installers and portable ZIPs for x64 and ARM64.
          - Linux: run \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/install.sh | sh\` for a per-user installation with checksum verification (nightly by default; add \`-s -- --version latest\` after \`sh\` for stable).
          - Bridge still requires Tailscale and the chosen ACP agents to be installed separately.
          - Open the bridge's HTTPS URL from Tailscale Serve to use the browser app.
          - Verify downloads with SHA256SUMS.

          [Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
      - name: Create or move nightly tag
        if: needs.prepare.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi
      - name: Create or update the same release
        run: |
          set -euo pipefail
          if [[ "$UPDATE_CHANNEL" == release ]]; then
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --title "v$APP_VERSION" \
                --notes-file "$RUNNER_TEMP/nightly-notes.md" --draft=false --prerelease=false --latest
              gh release upload "$RELEASE_TAG" dist/* --clobber
            else
              gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --title "v$APP_VERSION" \
                --notes-file "$RUNNER_TEMP/nightly-notes.md" --latest dist/*
            fi
            exit 0
          fi
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --target "$GITHUB_SHA" --title Nightly --notes-file "$RUNNER_TEMP/nightly-notes.md" \
              --draft=false --prerelease --latest=false
          else
            gh release create nightly --verify-tag --target "$GITHUB_SHA" --title Nightly \
              --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --latest=false
          fi
          gh release upload nightly dist/* --clobber
          gh release view nightly --json assets --jq '.assets[].name' > "$RUNNER_TEMP/nightly-assets.txt"
          while IFS= read -r asset; do
            if [[ ! -f "dist/$asset" ]]; then
              gh release delete-asset nightly "$asset" --yes
            fi
          done < "$RUNNER_TEMP/nightly-assets.txt"
